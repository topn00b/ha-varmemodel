name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -q -p no:logging

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Ikke i HA's brands-repo.
          ignore: brands

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kun eksempel-entiteter må stå i repoet (sensor.vp_el, sensor.ude, sensor.rum_1 …).
      - run: |
          if grep -rnE "nordpool_|danfoss|termostat_|bthome|shelly|lg_|@gmail|token" --include=*.py --include=*.json --include=*.md --include=*.yaml --include=*.html --exclude-dir=.github . ; then
            echo "Mulige personlige data fundet"; exit 1; fi

  version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Udgivelsens tag skal passe med versionen i manifest.json, ellers henter HACS den forkerte
      - run: test "v$(jq -r .version custom_components/varmemodel/manifest.json)" = "${GITHUB_REF_NAME}"
